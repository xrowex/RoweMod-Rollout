name: Windows portable package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app with bundled runtime
        shell: pwsh
        run: ./tools/package_rowemod.ps1
      - name: Test portable ZIP without dotnet on PATH
        shell: pwsh
        run: ./tools/test_portable.ps1 -Zip releases/RoweMod-Windows-x64.zip -Output '${{ runner.temp }}/portable-check'
      - uses: actions/upload-artifact@v4
        with:
          name: RoweMod-Windows-x64
          path: |
            releases/RoweMod-Windows-x64.zip
            releases/RoweMod-Windows-x64.zip.sha256
          if-no-files-found: error
